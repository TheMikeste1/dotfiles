---
persist_source_packages_dir: '{{ ansible_facts.user_dir }}/src'

# Build tools (via system package manager)
build_tools:
  system:
    - git
    - pinentry-qt
    - pkg-config
    - unzip
    - zip
  git_build:
    - name: ninja-build
      bin: ninja
      version: release
      repo: git@github.com:ninja-build/ninja.git
      configure_flags: -DCMAKE_BUILD_TYPE=Release -DCMAKE_GENERATOR="Unix Makefiles"
        -DBUILD_TESTING=OFF

# Package managers to install
package_managers:
  - name: luarocks
    install_with: system
    pkg_name: luarocks
  - name: npm
    install_with: system
    pkg_name: npm
  - name: mise
    install_with: cargo
    pkg_name: mise
  - name: uv
    install_with: cargo-git
    url: https://github.com/astral-sh/uv
  - name: pip
    install_with: system
    pkg_name: python3-pip

# Executables from package managers
managed_packages:
  - name: bat
    install_with: cargo
    pkg_name: bat
  - name: cargo-update
    install_with: cargo
    pkg_name: cargo-update
  - name: eza
    install_with: cargo
    pkg_name: eza
  - name: fd-find
    install_with: cargo
    pkg_name: fd-find
  - name: git-delta
    install_with: cargo
    pkg_name: git-delta
  - name: just
    install_with: cargo
    pkg_name: just
  - name: mdbook
    install_with: cargo
    pkg_name: mdbook
  - name: mise
    install_with: cargo
    pkg_name: mise
  - name: ripgrep
    install_with: cargo
    pkg_name: ripgrep
  - name: tree-sitter-cli
    install_with: cargo
    pkg_name: tree-sitter-cli
  - name: lefthook
    install_with: go
    url: github.com/evilmartians/lefthook
    version: latest
  - name: fzf
    install_with: go
    url: github.com/junegunn/fzf
    version: latest
  - name: lazygit
    install_with: go
    url: github.com/jesseduffield/lazygit
    version: latest
  - name: lazydocker
    install_with: go
    url: github.com/jesseduffield/lazydocker
    version: latest
  - name: chezmoi
    install_with: mise
    version: latest
  - name: python
    install_with: mise
    version: latest
  - name: tmux
    install_with: system
    pkg_name: tmux
  - name: xclip
    install_with: system
    pkg_name: xclip
  - name: zsh
    install_with: system
    pkg_name: zsh
